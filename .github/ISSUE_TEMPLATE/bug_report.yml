name: Bug Report
description: File a bug report for VibeDebt
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue in VibeDebt! Please provide details below.
  - type: input
    id: version
    attributes:
      label: VibeDebt Version
      description: What version of VibeDebt and Node.js are you running?
      placeholder: "e.g. VibeDebt 0.1.0, Node 24.x"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or repository snippet to reproduce the issue.
      placeholder: |
        1. Run `vibedebt map ./my-project`
        2. Run `vibedebt anchor ./my-project`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
